name: Publicar PRD en GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Seguro: un build de PRD nunca debe quedar en modo prueba.
      - name: Verificar que no es un build de prueba
        run: |
          if grep -rq "Modo prueba" dist; then
            echo "El build contiene el modo prueba: no se publica en PRD."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
